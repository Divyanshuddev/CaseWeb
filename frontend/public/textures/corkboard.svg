<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="cork-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0.35 0 0 0 0.25  0.22 0 0 0 0.12  0.12 0 0 0 0.06  0 0 0 0.55 0" in="noise" result="coloredNoise"/>
    </filter>
    <radialGradient id="cork-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#845438"/>
      <stop offset="70%" stop-color="#70452D"/>
      <stop offset="100%" stop-color="#4B2B1A"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#cork-vignette)"/>
  <rect width="400" height="400" filter="url(#cork-noise)" opacity="0.85"/>
</svg>
